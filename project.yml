name: SpacedHabits
options:
  bundleIdPrefix: ga.emira.spacedhabits
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: EZ6C73TWB8
packages:
  HabitCore: { path: Packages/HabitCore }
  HabitStore: { path: Packages/HabitStore }
  HabitUI: { path: Packages/HabitUI }
targets:
  SpacedHabits:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    info:
      path: Apps/iOS/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ga.emira.spacedhabits.refresh]
        # XcodeGen's defaults would pin these to 1.0 / 1, shadowing the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Apps/iOS/SpacedHabits.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ga.emira.spacedhabits
    dependencies:
      - package: HabitCore
      - package: HabitStore
      - package: HabitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ga.emira.spacedhabits
        PRODUCT_NAME: SpacedHabits
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spaced Habits
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  SpacedHabitsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/iOSTests]
    dependencies:
      - target: SpacedHabits
      - package: HabitUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpacedHabitsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/iOSUITests]
    dependencies:
      - target: SpacedHabits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpacedHabits
schemes:
  SpacedHabits:
    build:
      targets:
        SpacedHabits: all
    test:
      targets: [SpacedHabitsTests, SpacedHabitsUITests]
