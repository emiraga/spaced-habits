name: SpacedHabits
options:
  developmentLanguage: en
  bundleIdPrefix: ga.emira.spacedhabits
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    # String Catalogs, en base (DESIGN.md §2.2); `make strings` fills them from the sources.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: EZ6C73TWB8
    # Export compliance (§2): only Apple's HTTPS/CloudKit encryption, which is exempt; App Store Connect stops asking.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
packages:
  HabitCore: { path: Packages/HabitCore }
  HabitStore: { path: Packages/HabitStore }
  HabitUI: { path: Packages/HabitUI }
targets:
  SpacedHabits:
    type: application
    platform: iOS
    # Apps/WatchBridge: WatchConnectivity to the watch app (§7).
    sources: [Apps/iOS, Apps/Shared, Apps/WatchBridge]
    info:
      path: Apps/iOS/Info.plist
      properties:
        # remote-notification: CloudKit's silent pushes (§10).
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [ga.emira.spacedhabits.refresh]
        # Widget taps (DeepLink).
        CFBundleURLTypes:
          - CFBundleURLName: ga.emira.spacedhabits
            CFBundleURLSchemes: [spacedhabits]
        # Drag and drop on Today (TodayDrag).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ga.emira.spacedhabits.today-row
            UTTypeDescription: Spaced Habits list row
            UTTypeConformsTo: [public.data]
        # XcodeGen's defaults would pin these to 1.0 / 1, shadowing the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Apps/iOS/SpacedHabits.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ga.emira.spacedhabits
        com.apple.developer.icloud-container-identifiers:
          - iCloud.ga.emira.spacedhabits
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    dependencies:
      - package: HabitCore
      - package: HabitStore
      - package: HabitUI
      - target: SpacedHabitsWidgets
      - target: SpacedHabitsWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ga.emira.spacedhabits
        PRODUCT_NAME: SpacedHabits
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spaced Habits
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  SpacedHabitsWidgets:
    type: app-extension
    platform: iOS
    # Apps/Widgets: the widgets, shared with the watch's extension. Apps/Shared: AnswerHabitIntent runs in
    # whichever process the button's widget lives in.
    sources: [Apps/iOSWidgets, Apps/Widgets, Apps/Shared]
    info:
      path: Apps/iOSWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Apps/iOSWidgets/SpacedHabitsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ga.emira.spacedhabits
    dependencies:
      - package: HabitCore
      - package: HabitStore
      - package: HabitUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ga.emira.spacedhabits.widgets
        PRODUCT_NAME: SpacedHabitsWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spaced Habits
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  SpacedHabitsWatch:
    type: application
    platform: watchOS
    sources: [Apps/watchOS, Apps/WatchBridge]
    info:
      path: Apps/watchOS/Info.plist
      properties:
        WKApplication: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Apps/watchOS/SpacedHabitsWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ga.emira.spacedhabits
        com.apple.developer.icloud-container-identifiers:
          - iCloud.ga.emira.spacedhabits
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    dependencies:
      - package: HabitCore
      - package: HabitStore
      - package: HabitUI
      - target: SpacedHabitsWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ga.emira.spacedhabits.watchkitapp
        PRODUCT_NAME: SpacedHabitsWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spaced Habits
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ga.emira.spacedhabits
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  SpacedHabitsWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [Apps/watchOSWidgets, Apps/Widgets, Apps/Shared]
    info:
      path: Apps/watchOSWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Apps/watchOSWidgets/SpacedHabitsWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ga.emira.spacedhabits
    dependencies:
      - package: HabitCore
      - package: HabitStore
      - package: HabitUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ga.emira.spacedhabits.watchkitapp.widgets
        PRODUCT_NAME: SpacedHabitsWatchWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spaced Habits
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  SpacedHabitsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/iOSTests]
    dependencies:
      - target: SpacedHabits
      - package: HabitCore
      - package: HabitStore
      - package: HabitUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpacedHabitsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/iOSUITests]
    dependencies:
      - target: SpacedHabits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpacedHabits
  # App Store screenshots of the watch app (`make screenshots-watch`); in no test run.
  SpacedHabitsWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [Apps/watchOSUITests]
    dependencies:
      - target: SpacedHabitsWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpacedHabitsWatch
schemes:
  SpacedHabits:
    build:
      targets:
        SpacedHabits: all
    test:
      targets: [SpacedHabitsTests, SpacedHabitsUITests]
  # Run on a paired watch from Xcode; the iOS scheme only installs the phone app. Building SpacedHabits too
  # makes Xcode install the companion app on the phone before the watch app.
  SpacedHabitsWatch:
    build:
      targets:
        SpacedHabits: all
        SpacedHabitsWatch: all
    run:
      executable: SpacedHabitsWatch
  SpacedHabitsWatchScreenshots:
    build:
      targets:
        SpacedHabitsWatch: all
    test:
      targets: [SpacedHabitsWatchUITests]
