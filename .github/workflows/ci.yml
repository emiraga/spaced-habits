name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode from .xcode-version
        run: |
          version="$(cat .xcode-version)"
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode $version not found on runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('.xcode-version', 'Packages/*/Package.swift', 'Packages/*/Package.resolved') }}

      - name: Install tools
        run: brew bundle

      - name: make ci
        run: make ci
